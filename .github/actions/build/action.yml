name: build
description: Build one runtime version with a pinned Bazel, run its tests, and upload the artifact.

inputs:
  runtime:
    description: Runtime name, from runtimes/<runtime>.json.
    required: true
  line:
    description: Version line, for example 22.
    required: true
  target:
    description: Bazel target to build.
    required: true
  version:
    description: Upstream version, for example 22.23.4.
    required: true
  test:
    description: Bazel test target or test suite.
    required: true
  system_ca_test:
    description: Bazel test that proves that the runtime trusts the system store.
    required: true
  artifact:
    description: Path or glob of the files to upload.
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-bazel

    - name: Build ${{ inputs.runtime }} ${{ inputs.line }}
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        # .bazelrc asks for 10 CPUs. Use what the machine has.
        bazel build --jobs=HOST_CPUS --local_resources=cpu=HOST_CPUS \
          --local_resources=memory=HOST_RAM*.8 \
          "$TARGET" --output_groups=+dist

    - name: Test ${{ inputs.runtime }} ${{ inputs.line }}
      shell: bash
      env:
        TEST: ${{ inputs.test }}
        SYSTEM_CA_TEST: ${{ inputs.system_ca_test }}
      run: |
        bazel test --jobs=HOST_CPUS --local_resources=cpu=HOST_CPUS \
          --local_resources=memory=HOST_RAM*.8 \
          "$TEST" "$SYSTEM_CA_TEST"

    - name: Collect the artifact
      shell: bash
      env:
        ARTIFACT: ${{ inputs.artifact }}
        NAME: ${{ inputs.runtime }}-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}
      run: |
        mkdir -p out
        # The path may be a glob, so it has no quotes.
        case "$ARTIFACT" in
          *.tar.gz*) cp -L $ARTIFACT out/ ;;
          *)
            mkdir -p "stage/$NAME"
            cp -RL $ARTIFACT "stage/$NAME/"
            tar -C stage -czf "out/$NAME.tar.gz" "$NAME"
            ;;
        esac
        (cd out && for f in *.tar.gz; do [ -e "$f.sha256" ] || shasum -a 256 "$f" > "$f.sha256"; done)

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.runtime }}-${{ inputs.line }}-${{ runner.os }}-${{ runner.arch }}
        path: out/*
        if-no-files-found: error
