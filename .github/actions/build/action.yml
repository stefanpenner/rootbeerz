name: build
description: Build one runtime version with a pinned Bazel, run its tests, and upload the artifact.

inputs:
  runtime:
    description: Runtime name, from runtimes/<runtime>/manifest.json.
    required: true
  line:
    description: Version line, for example 22.
    required: true
  target:
    description: Bazel target to build.
    required: true
  version:
    description: Upstream version, for example 22.23.4.
    required: true
  test:
    description: Bazel test target or test suite.
    required: true
  system_ca_test:
    description: Bazel test that proves that the runtime trusts the system store.
    required: true
  artifact:
    description: Path or glob of the files to upload.
    required: true

# Each step is one call to .github/workflows/gha.py. Inputs go through env, never into the command.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-bazel

    - name: Build ${{ inputs.runtime }} ${{ inputs.line }}
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: python3 .github/workflows/gha.py build --target "$TARGET"

    - name: Test ${{ inputs.runtime }} ${{ inputs.line }}
      shell: bash
      env:
        TEST: ${{ inputs.test }}
        SYSTEM_CA_TEST: ${{ inputs.system_ca_test }}
      run: python3 .github/workflows/gha.py test "$TEST" "$SYSTEM_CA_TEST"

    - name: Collect the artifact
      shell: bash
      env:
        RUNTIME: ${{ inputs.runtime }}
        VERSION: ${{ inputs.version }}
        ARTIFACT: ${{ inputs.artifact }}
      run: python3 .github/workflows/gha.py collect --runtime "$RUNTIME" --version "$VERSION" --artifact "$ARTIFACT"

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.runtime }}-${{ inputs.line }}-${{ runner.os }}-${{ runner.arch }}
        path: out/*
        if-no-files-found: error
